<!-- 主菜单 -->

</div>

    <button id="btnChallengeBack" class="ghostbtn">返回</button>
  </div>
</div>

<!-- 结算 -->
<div id="endPanel" class="panel hidden">

    <button id="btnEndMenu" class="ghostbtn">返回菜单</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="topBar">
    <div class="pcard" id="pcard0">

    </div>
    <div id="vsTag">VS</div>
    <div class="pcard" id="pcard1">
      <div class="pname">玩家2</div><div class="pgroup">未定</div><div class="pballs"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="challengeInfo" class="hidden"></div>
  <button id="retryBtn" class="hidden">↺ 重摆本关</button>
  <div id="powerWrap">
    <div id="powerLabel">力度</div>
    <div id="powerTrack"><div id="powerFill"></div></div>
  </div>
  <div id="spinMini"><div id="spinMiniDot"></div></div>

<div id="spinBig" class="hidden">
  <div id="spinCtrl">
    <div id="spinPad"><div id="spinDot"></div></div>

    <div class="row">
      <button id="spinReset" class="small">归零</button>
